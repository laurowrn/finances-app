services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - mongo
      - keycloak
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: group_finance
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be defined in .env}
      LOGIN_PASSWORD: ${LOGIN_PASSWORD:?LOGIN_PASSWORD must be defined in .env}
      USER_A_NAME: ${USER_A_NAME:-Pessoa A}
      USER_A_SALARY: ${USER_A_SALARY:-5000}
      USER_B_NAME: ${USER_B_NAME:-Pessoa B}
      USER_B_SALARY: ${USER_B_SALARY:-3000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:?SECRETS_ENCRYPTION_KEY must be defined in .env}
      ADMIN_STATE_DIR: /run/finances-admin
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-https://finances.tail1ebd6.ts.net/auth/realms/group-finance}
      OIDC_INTERNAL_ISSUER_URL: ${OIDC_INTERNAL_ISSUER_URL:-http://keycloak:8080/auth/realms/group-finance}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-group-finance-web}
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-https://finances.tail1ebd6.ts.net/login}
      OIDC_ALLOWED_EMAILS: ${OIDC_ALLOWED_EMAILS:-laurowrn@gmail.com,nayarapaolat@gmail.com}
      OIDC_EMAIL_USER_MAP: ${OIDC_EMAIL_USER_MAP:?OIDC_EMAIL_USER_MAP must be defined in .env}
      CORS_ORIGINS: https://finances.tail1ebd6.ts.net
    volumes:
      - /var/lib/finances-app:/run/finances-admin

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3009:3009"
    volumes:
      # dev server: código montado do host para o Vite recarregar sem rebuild.
      # O volume anônimo preserva o node_modules instalado na imagem.
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE: /api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN must be defined in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be defined in .env}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: https://finances.tail1ebd6.ts.net/auth
      KC_PROXY_HEADERS: xforwarded
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=50
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/group-finance-realm.json:ro

volumes:
  mongo_data:
  caddy_data:
  caddy_config:
  keycloak_data:
